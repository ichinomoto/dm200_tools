[Service]
# Debian's D-Bus wpa_supplicant service normally starts without a configuration
# file.  Load the DM200 global setting so NetworkManager does not request the
# unsupported p2p-dev-wlan0 interface.
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -u -s -O "DIR=/run/wpa_supplicant GROUP=netdev" -c /etc/wpa_supplicant/wpa_supplicant.conf
