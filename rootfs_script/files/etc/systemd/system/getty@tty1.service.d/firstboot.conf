[Unit]
# A failed platform attempt must not cancel getty's start job permanently.
# ExecStartPre waits for successful completion across platform retries.
Wants=pomera-platform-firstboot.service console-setup.service
After=pomera-platform-firstboot.service console-setup.service

[Service]
# Use getty's own TTY. agetty must not read input or print a login prompt
# until user creation succeeds. Completed setup returns immediately.
ExecStartPre=/usr/local/sbin/pomera-user-firstboot.sh
TimeoutStartSec=0
TTYReset=yes
